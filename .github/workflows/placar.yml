name: Placar

on:
  pull_request:
    types: [closed]
  pull_request_review:
    types: [submitted]
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  actions: read

# Evita duas execuções gravando o ranking ao mesmo tempo
concurrency:
  group: placar
  cancel-in-progress: false

jobs:
  pontuar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Calcular pontos
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node placar/cli.js
      - name: Salvar ranking
        run: |
          if [[ -n "$(git status --porcelain docs/ranking.json)" ]]; then
            git config user.name "placar-devops[bot]"
            git config user.email "placar-devops@users.noreply.github.com"
            git add docs/ranking.json
            git commit -m "chore(placar): atualiza ranking [skip ci]"
            git push
          fi
